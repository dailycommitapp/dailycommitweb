name: Validate Docker Builds

# The image only ever contains apps/web, apps/collab and apps/api (see
# Dockerfile). A README edit or a CLI-only change cannot alter the image, so it
# does not need one. Deliberately a deny-list rather than an allow-list:
# anything new at the repo root still triggers a build. The list is spelled out
# twice because GitHub Actions does not support YAML anchors, so keep both copies
# in sync.
on:
  push:
    branches:
      - prod
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/cli/**'
      - 'apps/e2e/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches:
      - prod
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/cli/**'
      - 'apps/e2e/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

permissions:
  contents: read

# See api-lint.yaml: one live run per PR, dev runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Prepare platform pair
        id: prep
        run: |
          echo "platform_pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Validate application image build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            LEARNHOUSE_PUBLIC=true
          cache-from: type=gha,scope=${{ steps.prep.outputs.platform_pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.platform_pair }}
          push: false
          outputs: type=cacheonly

  service-images:
    name: Service image (${{ matrix.service }})
    runs-on: ubuntu-latest
    # The Dockerfiles under apps/ build the per-service
    # images. Nothing in this repo built them: the job above only builds the
    # root Dockerfile, so a change that broke a service image passed every
    # check here and failed later, in the pipeline that ships it. Build them,
    # never push them; publishing those tags stays with the image pipeline.
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, collab]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./apps/${{ matrix.service }}
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=service-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.service }}

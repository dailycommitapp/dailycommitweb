name: dailycommit-dev

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${DAILYCOMMIT_IMAGE:?Set the immutable GHCR image reference}
    restart: unless-stopped
    init: true
    env_file:
      - path: ./app.env
        format: raw
    expose:
      - "80"
    volumes:
      - content:/app/api/content
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --max-time 8 http://127.0.0.1/api/v1/health >/dev/null &&
          curl --fail --silent --max-time 8 http://127.0.0.1:8000/login >/dev/null &&
          nc -z -w 3 127.0.0.1 4000
      interval: 20s
      timeout: 20s
      retries: 6
      start_period: 120s
    stop_grace_period: 45s
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # SSR calls use the real HTTPS hostname without an Azure public-IP hairpin.
        aliases:
          - dev.dailycommit.co.za
    # Start independently: app health can itself require this HTTPS endpoint.
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - path: ./db.env
        format: raw
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U learnhouse -d learnhouse"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    logging: *logging

  redis:
    image: redis:8.6.1-alpine
    restart: unless-stopped
    env_file:
      - path: ./redis.env
        format: raw
    command:
      - sh
      - -ec
      - 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

volumes:
  postgres:
    name: dailycommit-dev-postgres
  redis:
    name: dailycommit-dev-redis
  content:
    name: dailycommit-dev-content
  caddy_data:
    name: dailycommit-dev-caddy-data
  caddy_config:
    name: dailycommit-dev-caddy-config
